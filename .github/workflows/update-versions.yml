name: Update Versions

on:
  schedule:
    # Hourly at a random minute, avoiding busy times like :00 and :30.
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  update-versions:
    if: github.repository_owner == 'PIH'
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: PIH/openmrs-contrib-distro-tools/.github/workflows/update-versions.yml@main
    secrets: inherit
