name: Update Versions

on:
  schedule:
    # Hourly, at a minute picked at random rather than :30 (see check-dependencies.yml). On :30 only
    # 26 of 168 hourly runs happened in the week to 2026-11-12.
    - cron: "25 * * * *"
  workflow_dispatch:

jobs:
  update-versions:
    if: github.repository_owner == 'PIH'
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: PIH/openmrs-contrib-distro-tools/.github/workflows/update-versions.yml@main
    secrets: inherit
