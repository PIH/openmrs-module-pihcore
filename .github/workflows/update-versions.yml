name: Update Versions

on:
  schedule:
    # Hourly, at a quiet minute rather than :00 or :30 (see check-dependencies.yml).
    - cron: "43 * * * *"
  workflow_dispatch:

jobs:
  update-versions:
    if: github.repository_owner == 'PIH'
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: PIH/openmrs-contrib-distro-tools/.github/workflows/update-versions.yml@main
    secrets: inherit
