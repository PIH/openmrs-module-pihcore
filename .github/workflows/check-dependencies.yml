name: Check dependencies
on:
  schedule:
    # Hourly, at a quiet minute rather than :00 or :30: GitHub runs scheduled workflows best-effort and
    # delays or drops them most at busy times such as the top of the hour. On :00 (this workflow) and
    # :30 (update-versions) only about 15% of hourly runs happened (25-26 of 168 in the week to 2026-11-12).
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pihcore module
        uses: actions/checkout@v4
        with:
          path: repository
      - name: Check out PIH tools
        uses: actions/checkout@v4
        with:
          repository: PIH/tools
          path: tools
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 8
          cache: 'maven'
      - name: Check dependencies
        id: checkDependencies
        shell: bash
        run: |
          #!/usr/bin/env bash
          set +e
          ./tools/ci/dependency-status-with-repolling.sh -r 300 -d ./repository
          if [ $? -eq 1 ]; then
            cd repository && gh workflow run deploy.yml
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}