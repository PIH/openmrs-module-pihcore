name: Check dependencies
on:
  schedule:
    # Hourly, but deliberately not at minute 0: GitHub runs scheduled workflows best-effort, and the
    # top of the hour is its busiest time, when it delays or drops the most runs. At "0 * * * *" only
    # about 15% of the hourly runs actually happened (25 of 168 in the week to 2026-11-12).
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pihcore module
        uses: actions/checkout@v4
        with:
          path: repository
      - name: Check out PIH tools
        uses: actions/checkout@v4
        with:
          repository: PIH/tools
          path: tools
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 8
          cache: 'maven'
      - name: Check dependencies
        id: checkDependencies
        shell: bash
        run: |
          #!/usr/bin/env bash
          set +e
          ./tools/ci/dependency-status-with-repolling.sh -r 300 -d ./repository
          if [ $? -eq 1 ]; then
            cd repository && gh workflow run deploy.yml
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}