name: Check dependencies
on:
  schedule:
    # Hourly, at a minute picked at random rather than :00: GitHub runs scheduled workflows best-effort
    # and recommends avoiding the start of the hour, when runs are delayed or dropped most (see the
    # "schedule" event in GitHub's "Events that trigger workflows" docs). On :00 only 25 of 168 hourly
    # runs happened in the week to 2026-11-12.
    - cron: "15 * * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pihcore module
        uses: actions/checkout@v4
        with:
          path: repository
      - name: Check out PIH tools
        uses: actions/checkout@v4
        with:
          repository: PIH/tools
          path: tools
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 8
          cache: 'maven'
      - name: Check dependencies
        id: checkDependencies
        shell: bash
        run: |
          #!/usr/bin/env bash
          set +e
          ./tools/ci/dependency-status-with-repolling.sh -r 300 -d ./repository
          if [ $? -eq 1 ]; then
            cd repository && gh workflow run deploy.yml
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}