name: Deploy

on:
  push:
    branches: ['master']
  workflow_dispatch:

jobs:
  build-and-publish:
    if: github.repository_owner == 'PIH'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: PIH/openmrs-contrib-distro-tools/.github/workflows/build-and-deploy-to-openmrs-jfrog.yml@main
    secrets: inherit

  # Kept as a separate job since a reusable-workflow call can't have additional steps of its
  # own. Runs only on successful deploy (default behavior for a job with `needs`).
  trigger-pihemr-build:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GHA_WRITE_TOKEN }}
          repository: PIH/pihemr
          event-type: dependency-trigger
